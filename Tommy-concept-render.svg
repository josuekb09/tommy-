<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f4ef"/><stop offset="1" stop-color="#e6e2d8"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f3a"/><stop offset="1" stop-color="#15181f"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8dffb0"/><stop offset="0.6" stop-color="#25c25a"/><stop offset="1" stop-color="#14903f"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0.55" stop-color="#2ad466" stop-opacity="0.45"/><stop offset="1" stop-color="#2ad466" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity="0.28"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1a2330">TOMMY — Concept Render (v0.1)</text>
<text x="600" y="68" text-anchor="middle" font-size="14" fill="#5a6270">Smart timekeeper for Toastmasters meetings · three views · dimensions approximate</text>

<!-- VIEW 1: operator face -->
<g transform="translate(40,100)">
<rect x="0" y="0" width="330" height="440" rx="26" fill="url(#body)" filter="url(#sh)"/>
<rect x="18" y="18" width="294" height="404" rx="16" fill="#0c0f14"/>
<text x="165" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#7fb5ff" letter-spacing="3">TOMMY</text>
<text x="165" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Kim Austen</text>
<text x="165" y="96" text-anchor="middle" font-size="12" fill="#9aa4b2">Icebreaker · Speech 1</text>
<rect x="30" y="112" width="270" height="108" rx="14" fill="#16331f"/>
<text x="165" y="190" text-anchor="middle" font-size="76" font-weight="800" fill="#4cf27f" font-family="Menlo, Consolas, monospace">04:12</text>
<g font-size="12" font-weight="700" text-anchor="middle">
<rect x="30" y="236" width="84" height="26" rx="13" fill="#2ecc5f"/><text x="72" y="254" fill="#06240f">G 4:00</text>
<rect x="123" y="236" width="84" height="26" rx="13" fill="#ffd21f"/><text x="165" y="254" fill="#3a2e00">Y 5:00</text>
<rect x="216" y="236" width="84" height="26" rx="13" fill="#ff4d4d"/><text x="258" y="254" fill="#3a0000">R 6:00</text>
</g>
<g font-size="14" font-weight="700" text-anchor="middle">
<rect x="30" y="280" width="130" height="56" rx="14" fill="#1f7cff"/><text x="95" y="314" fill="#fff">PAUSE</text>
<rect x="170" y="280" width="130" height="56" rx="14" fill="#c93535"/><text x="235" y="314" fill="#fff">STOP</text>
<rect x="30" y="348" width="60" height="40" rx="12" fill="#2b313d"/><text x="60" y="373" fill="#dfe6f2">+5s</text>
<rect x="100" y="348" width="60" height="40" rx="12" fill="#2b313d"/><text x="130" y="373" fill="#dfe6f2">+10s</text>
<rect x="170" y="348" width="60" height="40" rx="12" fill="#2b313d"/><text x="200" y="373" fill="#dfe6f2">NEXT</text>
<rect x="240" y="348" width="60" height="40" rx="12" fill="#2b313d"/><text x="270" y="373" fill="#dfe6f2">GUEST</text>
</g>
<text x="165" y="410" text-anchor="middle" font-size="10" fill="#6f7a8a">Wi-Fi ● · Battery 86% · Log saved</text>
<text x="165" y="474" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2330">1 · Operator face (touchscreen)</text>
</g>

<!-- VIEW 2: speaker face -->
<g transform="translate(430,100)">
<rect x="0" y="0" width="330" height="440" rx="26" fill="url(#body)" filter="url(#sh)"/>
<circle cx="165" cy="190" r="205" fill="url(#halo)"/>
<circle cx="165" cy="190" r="136" fill="#0b0d12"/>
<circle cx="165" cy="190" r="126" fill="url(#glow)"/>
<circle cx="165" cy="190" r="126" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
<text x="165" y="205" text-anchor="middle" font-size="44" font-weight="800" fill="#ffffff" fill-opacity="0.9" font-family="Menlo, Consolas, monospace">04:12</text>
<rect x="30" y="360" width="270" height="44" rx="10" fill="#10131a"/>
<g fill="#2d3340"><rect x="110" y="368" width="6" height="28" rx="3"/><rect x="124" y="368" width="6" height="28" rx="3"/><rect x="138" y="368" width="6" height="28" rx="3"/><rect x="152" y="368" width="6" height="28" rx="3"/><rect x="166" y="368" width="6" height="28" rx="3"/><rect x="180" y="368" width="6" height="28" rx="3"/><rect x="194" y="368" width="6" height="28" rx="3"/><rect x="208" y="368" width="6" height="28" rx="3"/></g>
<text x="60" y="388" font-size="11" font-weight="700" fill="#7fb5ff" letter-spacing="2">TOMMY</text>
<text x="165" y="474" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2330">2 · Speaker face (light disc)</text>
<text x="165" y="494" text-anchor="middle" font-size="12" fill="#5a6270">Ø 120 mm frosted diffuser · RGB ring · flashes at each card</text>
</g>

<!-- VIEW 3: side profile -->
<g transform="translate(830,100)">
<polygon points="40,430 300,430 300,50 220,50" fill="url(#body)" filter="url(#sh)"/>
<line x1="220" y1="50" x2="40" y2="430" stroke="#4cb0ff" stroke-width="4"/>
<text x="112" y="206" font-size="11" fill="#7fb5ff" transform="rotate(-65 112 206)">touchscreen (≈ 65° tilt)</text>
<rect x="296" y="90" width="8" height="260" rx="4" fill="#ffffff" fill-opacity="0.9"/>
<text x="318" y="120" font-size="11" fill="#1a2330" transform="rotate(90 318 120)">diffuser / light disc</text>
<rect x="150" y="410" width="60" height="12" rx="3" fill="#0b0d12"/>
<text x="180" y="450" text-anchor="middle" font-size="11" fill="#5a6270">USB-C · power</text>
<rect x="224" y="392" width="60" height="22" rx="4" fill="#10131a"/><text x="254" y="407" text-anchor="middle" font-size="9" fill="#6f7a8a">speaker</text>
<line x1="40" y1="470" x2="300" y2="470" stroke="#5a6270"/><text x="170" y="488" text-anchor="middle" font-size="12" fill="#1a2330">≈ 100 mm depth</text>
<text x="170" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2330">3 · Side profile</text>
<text x="170" y="540" text-anchor="middle" font-size="12" fill="#5a6270">≈ 160 mm tall · wedge stands on desk</text>
</g>
<text x="600" y="684" text-anchor="middle" font-size="12" fill="#5a6270">Indicative layout for 3D-printing discussion. Final dimensions depend on the chosen screen, battery and LED ring.</text>
</svg>
