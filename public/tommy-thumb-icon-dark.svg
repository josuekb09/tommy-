<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 108 108" width="108" height="108" role="img" aria-label="Tommy thumbs-up clock" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.tm-hop{transform-box:view-box;transform-origin:22px 90px;animation:tm-hop 4s ease-in-out infinite}
.tm-wink{opacity:0;animation:tm-wink 4s steps(1,end) infinite}
.tm-eye{animation:tm-eye 4s steps(1,end) infinite}
@keyframes tm-hop{0%,40%,100%{transform:translateY(0) rotate(0)}10%{transform:translateY(-8px) rotate(-7deg)}20%{transform:translateY(0) rotate(0)}27%{transform:translateY(-3px) rotate(-3deg)}34%{transform:translateY(0) rotate(0)}}
@keyframes tm-wink{0%{opacity:0}60%{opacity:1}72%{opacity:0}}
@keyframes tm-eye{0%{opacity:1}60%{opacity:0}72%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tm-hop,.tm-wink,.tm-eye{animation:none}.tm-wink{opacity:0}.tm-eye{opacity:1}}
